name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM 18 quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 clang-format-18 clang-tidy-18
      - name: Check formatting
        run: clang-format-18 --dry-run --Werror src/*.cpp src/*.hpp tests/*.cpp
      - name: Configure compilation database
        run: >-
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DBUILD_TESTING=ON
      - name: Build analysis dependencies
        run: cmake --build build --parallel 2
      - name: Run static analysis on project sources
        run: clang-tidy-18 -p build src/*.cpp tests/*.cpp

  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            compiler: g++-13
            package: g++-13
            build-type: Release
            asan: 'OFF'
          - name: clang-release
            compiler: clang++-18
            package: clang-18
            build-type: Release
            asan: 'OFF'
          - name: clang-sanitizers
            compiler: clang++-18
            package: clang-18
            build-type: Debug
            asan: 'ON'
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install compiler
        env:
          COMPILER_PACKAGE: ${{ matrix.package }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "$COMPILER_PACKAGE"
      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
          BUILD_TYPE: ${{ matrix.build-type }}
          ASAN: ${{ matrix.asan }}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DBUILD_TESTING=ON
          -DKRETRIEVE_ASAN="$ASAN"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error
          --timeout 60 --output-junit ctest-results.xml
      - name: Preserve failed-test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            build/Testing/Temporary/
            build/ctest-results.xml
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
      - name: Record release build metadata
        if: github.event_name == 'push' && github.ref_type == 'tag' && matrix.name == 'gcc-release'
        env:
          VERSION: ${{ github.ref_name }}
          CXX: ${{ matrix.compiler }}
        run: |
          {
            printf 'Version: %s\nCommit: %s\nArchitecture: %s\n' "$VERSION" "$GITHUB_SHA" "$(uname -m)"
            cat /etc/os-release
            "$CXX" --version
            cmake --version
            ldd build/kretrieve
          } > build/BUILD-METADATA.txt
      - name: Preserve tested release binary
        if: github.event_name == 'push' && github.ref_type == 'tag' && matrix.name == 'gcc-release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-linux-x86_64
          path: |
            build/kretrieve
            build/BUILD-METADATA.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  release:
    name: release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and main ancestry
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_REF}^{commit}")"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-linux-x86_64
          path: tested
      - name: Package tested binary
        run: |
          package="kretrieve-${VERSION}-linux-x86_64"
          mkdir -p "dist/$package"
          install -m 755 tested/kretrieve "dist/$package/kretrieve"
          install -m 644 tested/BUILD-METADATA.txt README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && sha256sum "$package.tar.gz" > SHA256SUMS)
      - name: Verify archive and smoke-test extracted executable
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          smoke="$(mktemp -d "$RUNNER_TEMP/kretrieve-release.XXXXXX")"
          tar -xzf "dist/kretrieve-${VERSION}-linux-x86_64.tar.gz" -C "$smoke"
          cmake \
            "-DKRETRIEVE=$smoke/kretrieve-${VERSION}-linux-x86_64/kretrieve" \
            "-DTEST_ROOT=$smoke" \
            -P tests/prepare_cli_test.cmake
          bash tests/shard_cli_test.sh "$smoke/kretrieve-${VERSION}-linux-x86_64/kretrieve" "$smoke"
      - name: Publish release without replacing existing versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Include drafts, and fail closed if the API request fails.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if grep -Fxq -- "$VERSION" "$RUNNER_TEMP/release-tags.txt"; then
            echo "A release already exists for $VERSION; refusing to replace it." >&2
            exit 1
          fi
          args=()
          if [[ "$VERSION" == *-rc.* ]]; then
            args+=(--prerelease)
          fi
          # Keep it a draft until every asset has uploaded successfully.
          gh release create "$VERSION" \
            "dist/kretrieve-${VERSION}-linux-x86_64.tar.gz" dist/SHA256SUMS \
            --verify-tag --generate-notes --draft "${args[@]}"
          gh release edit "$VERSION" --draft=false
